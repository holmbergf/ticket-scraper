# DuckDB reads the committed Parquet raw zone directly off disk
# (see macros/raw_table.sql). Dev and prod differ only in the DuckDB
# file they build into.
dbt_transform:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: dev.duckdb
      threads: 4
    prod:
      type: duckdb
      path: warehouse.duckdb
      threads: 4
