version: 2

models:
  - name: clean_tickets_events
    description: "One normalized row per (collection, source, event); participants/city/stage/country canonicalized."
    columns:
      - name: collection_slug
        tests: [not_null]
      - name: event_key
        tests: [not_null]
      - name: source
        tests: [not_null]
      - name: event_id_external
        tests: [not_null]

  - name: dim_tickets_events
    description: "Conformed canonical event dimension, one row per (collection, event_key)."
    columns:
      - name: event_uid
        tests: [not_null, unique]
      - name: match_key
        tests: [not_null, unique]

  - name: fct_tickets_latest_prices
    description: "Latest snapshot per (collection, source, event), integer cents."
    columns:
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['fifacollect', 'gametime', 'stubhub', 'viagogo', 'vivid']

  - name: semantic_event_prices
    description: "One row per canonical event at current prices (dollars). Dashboard surface."
    columns:
      - name: event_uid
        tests: [not_null, unique]
