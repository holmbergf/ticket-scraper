name: 'dbt_transform'
version: '1.0.0'
require-dbt-version: [">=1.8.0", "<3.0.0"]
profile: 'dbt_transform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Full-refresh builds throughout (elt-pipeline convention): at this volume
# a full prod build takes seconds. Switch facts to incremental merge on
# (source, event_id_external, crawl_ts_utc) when a full build nears ~10 min.
models:
  dbt_transform:
    connector:
      tickets:
        bronze:
          +materialized: view
        silver:
          +materialized: table
        gold:
          +materialized: table
        semantic:
          +materialized: view
