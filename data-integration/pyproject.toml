[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-ingest"
version = "0.2.0"
description = "Generic ticket-price ingestion: collection-configured marketplace crawlers landing content-addressed Parquet in the repo"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.2,<3",
    "pyarrow>=17,<23",
    "duckdb>=1.4,<2",
    "urllib3>=2,<3",
    "playwright>=1.49,<2",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
ticket-ingest = "ticket_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
