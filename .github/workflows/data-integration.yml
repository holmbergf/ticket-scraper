name: ci/data-integration

on:
  push:
    branches: [main]
    paths: ["data-integration/**", "collections/**", ".github/workflows/data-integration.yml", ".github/workflows/ingest-collection.yml", ".github/workflows/ingest-*.yml"]
  pull_request:
    paths: ["data-integration/**", "collections/**", ".github/workflows/data-integration.yml", ".github/workflows/ingest-collection.yml", ".github/workflows/ingest-*.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-data-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install "./data-integration[dev]"
      - name: Unit tests (committed HTML fixtures, no network/secrets needed)
        run: python -m pytest data-integration/tests -q
      - name: Byte-compile + CLI smoke
        run: |
          python -m compileall -q data-integration/src
          ticket-ingest --help
