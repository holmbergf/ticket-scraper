name: ingest (reusable)

# Reusable per-collection ingest. Each collection has a thin caller
# workflow (ingest-<slug>.yml); this file owns the actual crawl → dbt →
# publish → commit pipeline. Manual only — no schedules.
on:
  workflow_call:
    secrets:
      TICKET_SCRAPER_DASHBOARD_DEPLOY_KEY:
        required: false
    inputs:
      collection:
        description: "Collection slug (collections/<slug>.toml)"
        type: string
        required: true
      source:
        description: "Single source to crawl (empty = all configured)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      collection:
        description: "Collection slug (collections/<slug>.toml)"
        type: string
        required: true
        default: "fifa-world-cup-2026"
      source:
        description: "Single source to crawl (empty = all configured)"
        type: choice
        options: ["", fifacollect, gametime, stubhub, viagogo, vivid]
        default: ""

# The repo is the storage layer: this workflow commits new raw partitions
# and the published serving exports back to main.
permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-main-writer
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COLLECTION: ${{ inputs.collection }}
      SOURCE_INPUT: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('data-integration/pyproject.toml') }}
      - name: Install ingestion + dbt
        run: |
          pip install "./data-integration[dev]" "dbt-duckdb==1.10.0" "duckdb==1.4.4"
          playwright install --with-deps chrome chromium
          ticket-ingest collections validate "$COLLECTION"
      - name: Crawl (land raw Parquet)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          retry() { # content-addressed writes: safe to re-run the whole crawl
            local n=1
            while true; do
              "$@" && return 0
              [ $n -ge 3 ] && return 1
              echo "attempt $n failed; retrying in $((n * 30))s"
              sleep $((n * 30)); n=$((n + 1))
            done
          }
          if [ -n "$SOURCE_INPUT" ]; then
            retry ticket-ingest crawl --collection "$COLLECTION" --source "$SOURCE_INPUT" --alerts-json alerts.json
          else
            retry ticket-ingest crawl --collection "$COLLECTION" --alerts-json alerts.json
          fi
      - name: dbt build (prod) + publish warehouse
        working-directory: dbt-transform
        env:
          RAW_BASE_PATH: ${{ github.workspace }}/data
        run: |
          dbt build --target prod --profiles-dir .
          python -m ticket_ingest.publish_warehouse warehouse.duckdb
      - name: Commit data zones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the committed zones: raw partitions + manifests (append-only)
          # and the serving exports. Big derived silver mirrors and raw HTML
          # are gitignored (derived data is disposable; see .gitignore).
          git add data/raw data/_manifests data/data_warehouse
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "crawl($COLLECTION): $(date -u '+%Y-%m-%d %H:%M UTC')"
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase origin main && git push origin main; then pushed=true; break; fi
              echo "push attempt $attempt failed; retrying in 5s"; sleep 5
            done
            [ "$pushed" = "true" ]
          fi
      - name: Create issue for price alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f alerts.json ]; then echo "No alerts file"; exit 0; fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('alerts.json'))))")
          if [ "$COUNT" = "0" ]; then echo "No alerts triggered"; exit 0; fi
          BODY=$(python3 -c "
          import json
          alerts = json.load(open('alerts.json'))
          print(f'The crawl triggered **{len(alerts)} alert(s)**:')
          print()
          for a in alerts: print(f'- {a}')
          print()
          print('---')
          print('*Auto-generated by the ingest workflow.*')
          ")
          gh issue create \
            --title "Price Alert ($COLLECTION): $COUNT alert(s) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "$BODY" --label "alert"
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingest Failed ($COLLECTION) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "The ingest workflow failed. Check the [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: warehouse
          path: data/data_warehouse
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: dbt-state
          path: dbt-transform/target/manifest.json
          if-no-files-found: error
          retention-days: 14

  sync-dashboard:
    needs: ingest
    if: github.repository == 'holmbergf/ticket-scraper'
    uses: ./.github/workflows/sync-dashboard.yml
    secrets:
      TICKET_SCRAPER_DASHBOARD_DEPLOY_KEY: ${{ secrets.TICKET_SCRAPER_DASHBOARD_DEPLOY_KEY }}
