name: ingest/nfl-cowboys-at-seahawks-2026-12-07

# Manual caller for one collection. Copy this file per collection and
# change the collection input (slug = collections/<slug>.toml).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Single source to crawl (empty = all configured)"
        type: choice
        options: ["", gametime, stubhub, viagogo, vivid]
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    uses: ./.github/workflows/ingest-collection.yml
    secrets:
      TICKET_SCRAPER_DASHBOARD_DEPLOY_KEY: ${{ secrets.TICKET_SCRAPER_DASHBOARD_DEPLOY_KEY }}
    with:
      collection: nfl-cowboys-at-seahawks-2026-12-07
      source: ${{ inputs.source }}
