name: ingest

# Manual only: the tournament has concluded, so there is no schedule.
# Run on demand via workflow_dispatch (or locally with ticket-ingest).
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Single source to crawl (empty = all)"
        type: choice
        options: ["", fifacollect, gametime, stubhub, viagogo, vivid]
        default: ""

# The repo is the storage layer: this workflow commits new raw partitions
# and the published serving exports back to main.
permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('data-integration/pyproject.toml') }}
      - name: Install ingestion + dbt
        run: |
          pip install "./data-integration[dev]" dbt-duckdb duckdb
          playwright install --with-deps chromium
      - name: Crawl (land raw Parquet)
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          retry() { # content-addressed writes: safe to re-run the whole crawl
            local n=1
            while true; do
              "$@" && return 0
              [ $n -ge 3 ] && return 1
              echo "attempt $n failed; retrying in $((n * 30))s"
              sleep $((n * 30)); n=$((n + 1))
            done
          }
          if [ -n "${{ inputs.source }}" ]; then
            retry ticket-ingest crawl --source "${{ inputs.source }}" --alerts-json alerts.json
          else
            retry ticket-ingest crawl --alerts-json alerts.json
          fi
      - name: dbt build (prod) + publish warehouse
        working-directory: dbt-transform
        env:
          RAW_BASE_PATH: ${{ github.workspace }}/data
        run: |
          dbt build --target prod --profiles-dir .
          python -m ticket_ingest.publish_warehouse warehouse.duckdb
      - name: Commit data zones
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the committed zones: raw partitions + manifests (append-only)
          # and the serving exports. Big derived silver mirrors and raw HTML
          # are gitignored (derived data is disposable; see .gitignore).
          git add data/raw data/_manifests data/data_warehouse
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "crawl: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
      - name: Create issue for price alerts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f alerts.json ]; then echo "No alerts file"; exit 0; fi
          COUNT=$(python3 -c "import json; print(len(json.load(open('alerts.json'))))")
          if [ "$COUNT" = "0" ]; then echo "No alerts triggered"; exit 0; fi
          BODY=$(python3 -c "
          import json
          alerts = json.load(open('alerts.json'))
          print(f'The crawl triggered **{len(alerts)} alert(s)**:')
          print()
          for a in alerts: print(f'- {a}')
          print()
          print('---')
          print('*Auto-generated by the ingest workflow.*')
          ")
          gh issue create \
            --title "Price Alert: $COUNT alert(s) — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "$BODY" --label "alert"
      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Ingest Failed — $(date -u '+%Y-%m-%d %H:%M UTC')" \
            --body "The ingest workflow failed. Check the [run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details." \
            --label "bug"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warehouse
          path: data/data_warehouse
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dbt-state
          path: dbt-transform/target/manifest.json
          if-no-files-found: error
