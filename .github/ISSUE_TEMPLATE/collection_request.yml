name: Collection request
description: Suggest a tournament, game, or multi-session event to track
labels: ["enhancement"]
body:
  - type: input
    id: event
    attributes:
      label: Event or tournament
      placeholder: "e.g. The Open Championship 2027"
    validations:
      required: true
  - type: input
    id: dates
    attributes:
      label: Dates and venue (if known)
  - type: textarea
    id: sources
    attributes:
      label: Marketplace links (if known)
      description: Direct event-page URLs are the most useful.
