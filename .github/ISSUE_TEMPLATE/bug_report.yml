name: Bug report
description: Report broken ingestion, warehouse, or dashboard behavior
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the collection slug, source, command or dashboard page, and timestamp if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (redacted)
      description: Remove tokens, cookies, and personal paths before posting.
      render: text
